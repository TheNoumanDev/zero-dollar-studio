name: Idea or request
description: A feature, a new kind of video, or support for another platform
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What would you like to make, and what's stopping you today?
    validations: {required: true}
  - type: textarea
    id: tools
    attributes:
      label: Free tools that could do it
      description: Optional. Links and licences, if you know some.
